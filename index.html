<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitario 2048: Neo-Night</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración Exclusiva de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        'neo-bg': '#0F172A',
                        'neo-danger': '#EF4444',
                    },
                    boxShadow: {
                        'glass': '0 8px 32px rgba(0, 0, 0, 0.3)',
                    },
                    keyframes: {
                        impact: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '50%': { transform: 'scaleX(1.1) scaleY(0.85)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)' },
                            '50%': { transform: 'scale(1.2)', filter: 'brightness(1.5)' },
                            '100%': { transform: 'scale(1)' },
                        },
                        clear2048: {
                            '0%': { transform: 'scale(1)', opacity: '1', filter: 'brightness(1)' },
                            '50%': { transform: 'scale(1.3)', opacity: '0.8', filter: 'brightness(2)' },
                            '100%': { transform: 'scale(0)', opacity: '0' },
                        }
                    },
                    animation: {
                        impact: 'impact 0.15s ease-out',
                        pop: 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        clear2048: 'clear2048 0.6s forwards',
                    }
                }
            }
        }
    </script>

    <!-- TRUCO VITAL: Declaramos los estilos aquí para que el CDN de Tailwind SÍ los escanee y los genere -->
    <script>
        const TAILWIND_CARD_STYLES = {
            2: "bg-[#64748B]",
            4: "bg-[#475569]",
            8: "bg-[#3B82F6] shadow-[0_0_15px_rgba(59,130,246,0.4)]",
            16: "bg-[#6366F1] shadow-[0_0_20px_rgba(99,102,241,0.5)]",
            32: "bg-[#8B5CF6] shadow-[0_0_25px_rgba(139,92,246,0.6)]",
            64: "bg-[#EC4899] shadow-[0_0_30px_rgba(236,72,153,0.7)]",
            128: "bg-[#D946EF] shadow-[0_0_35px_rgba(217,70,239,0.8)]",
            256: "bg-[#EF4444] shadow-[0_0_40px_rgba(239,68,68,0.9)]",
            512: "bg-[#F97316] shadow-[0_0_45px_rgba(249,115,22,1)]",
            1024: "bg-[#EAB308] shadow-[0_0_50px_rgba(234,179,8,1)] text-[#422006]",
            2048: "bg-[#10B981] shadow-[0_0_60px_rgba(16,185,129,1)] text-[#022C22]"
        };

        const BASE_CARD_CLASSES = [
            "w-full", "aspect-[1/1.3]", "max-w-[80px]", "min-h-[60px]", "rounded-lg", 
            "flex", "justify-center", "items-center", "font-montserrat", "font-black", 
            "text-white", "shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]", "transition-transform", "duration-100"
        ];
    </script>
</head>
<body class="bg-[radial-gradient(circle_at_center,_#1E293B_0%,_#0F172A_100%)] text-white font-sans min-h-screen flex flex-col items-center overflow-hidden touch-manipulation select-none">

    <!-- UI SUPERIOR -->
    <header class="w-full max-w-[500px] flex justify-between items-center p-6 mt-4">
        <!-- Panel Glassmorphism con Tailwind -->
        <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-glass flex flex-col items-start">
            <span class="text-xs uppercase tracking-[2px] text-slate-400">Puntuación</span>
            <span class="font-montserrat text-3xl font-black" id="score">0</span>
        </div>
        <button onclick="initGame()" class="bg-white/10 hover:bg-white/20 text-white border border-white/10 px-5 py-3 rounded-xl font-semibold transition-all duration-200 hover:-translate-y-1">
            Reiniciar
        </button>
    </header>

    <!-- ÁREA DEL MAZO -->
    <div class="my-4 flex flex-col items-center justify-center h-[120px]">
        <div class="text-sm text-slate-400 mb-2 uppercase tracking-wide">Siguiente Carta</div>
        <div id="deck-card-container">
            <!-- La carta actual se inyecta aquí -->
        </div>
    </div>

    <!-- TABLERO -->
    <div class="grid grid-cols-4 gap-3 w-full max-w-[500px] px-4 flex-grow mb-8" id="board">
        <!-- Columna 0 -->
        <div class="col-zone relative bg-white/5 border-2 border-white/10 rounded-xl flex flex-col-reverse items-center p-2 gap-2 transition-all duration-200 cursor-pointer h-[65vh] max-h-[500px] hover:bg-white/10 hover:border-white/30 hover:shadow-[0_0_20px_rgba(255,255,255,0.05)]" onclick="handleColumnClick(0)">
            <div id="danger-line-0" class="absolute top-0 left-0 w-full h-1 bg-red-500 rounded-t-xl opacity-30 transition-opacity duration-300"></div>
            <div id="col-content-0" class="flex flex-col-reverse items-center gap-2 w-full"></div>
        </div>
        <!-- Columna 1 -->
        <div class="col-zone relative bg-white/5 border-2 border-white/10 rounded-xl flex flex-col-reverse items-center p-2 gap-2 transition-all duration-200 cursor-pointer h-[65vh] max-h-[500px] hover:bg-white/10 hover:border-white/30 hover:shadow-[0_0_20px_rgba(255,255,255,0.05)]" onclick="handleColumnClick(1)">
            <div id="danger-line-1" class="absolute top-0 left-0 w-full h-1 bg-red-500 rounded-t-xl opacity-30 transition-opacity duration-300"></div>
            <div id="col-content-1" class="flex flex-col-reverse items-center gap-2 w-full"></div>
        </div>
        <!-- Columna 2 -->
        <div class="col-zone relative bg-white/5 border-2 border-white/10 rounded-xl flex flex-col-reverse items-center p-2 gap-2 transition-all duration-200 cursor-pointer h-[65vh] max-h-[500px] hover:bg-white/10 hover:border-white/30 hover:shadow-[0_0_20px_rgba(255,255,255,0.05)]" onclick="handleColumnClick(2)">
            <div id="danger-line-2" class="absolute top-0 left-0 w-full h-1 bg-red-500 rounded-t-xl opacity-30 transition-opacity duration-300"></div>
            <div id="col-content-2" class="flex flex-col-reverse items-center gap-2 w-full"></div>
        </div>
        <!-- Columna 3 -->
        <div class="col-zone relative bg-white/5 border-2 border-white/10 rounded-xl flex flex-col-reverse items-center p-2 gap-2 transition-all duration-200 cursor-pointer h-[65vh] max-h-[500px] hover:bg-white/10 hover:border-white/30 hover:shadow-[0_0_20px_rgba(255,255,255,0.05)]" onclick="handleColumnClick(3)">
            <div id="danger-line-3" class="absolute top-0 left-0 w-full h-1 bg-red-500 rounded-t-xl opacity-30 transition-opacity duration-300"></div>
            <div id="col-content-3" class="flex flex-col-reverse items-center gap-2 w-full"></div>
        </div>
    </div>

    <!-- MODAL GAME OVER -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div id="modalContent" class="bg-[#0F172A] p-10 rounded-3xl border-2 border-red-500 shadow-[0_0_50px_rgba(239,68,68,0.2)] text-center transform scale-75 transition-transform duration-300">
            <h2 class="font-montserrat text-4xl text-red-500 mb-4">FIN DEL JUEGO</h2>
            <p class="text-xl text-slate-200 mb-8">Puntuación Final: <strong id="finalScore" class="font-montserrat">0</strong></p>
            <button onclick="initGame()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-bold text-lg transition-colors duration-200">
                Volver a Jugar
            </button>
        </div>
    </div>

    <!-- Aquí enlazamos el archivo JavaScript externo -->
    <script src="app.js"></script>
</body>
</html>
