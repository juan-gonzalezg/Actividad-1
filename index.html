<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitario 2048 Neo-Night</title>
    <!-- Tailwind CSS (Única librería permitida) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neo: {
                            bg: '#0F172A',
                            accent: '#10B981',
                            panel: 'rgba(255, 255, 255, 0.05)',
                            border: 'rgba(16, 185, 129, 0.3)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Animaciones CSS personalizadas (El "Juice") */
        @keyframes dropIn {
            0% { transform: translateY(-80px); opacity: 0; }
            70% { transform: translateY(5px); } /* Rebote sutil */
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes squash {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(0.85) scaleX(1.1); }
        }
        @keyframes neonMerge {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes clearGlow {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            40% { transform: scale(1.1); filter: brightness(2); opacity: 1; }
            100% { opacity: 0; transform: scale(0.5); filter: brightness(0); }
        }

        /* Clases utilitarias para inyectar por JS */
        .anim-drop { animation: dropIn 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .anim-squash { animation: squash 0.15s ease-in-out forwards; }
        .anim-merge { animation: neonMerge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-clear { animation: clearGlow 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-neo-bg text-slate-100 min-h-screen font-sans flex flex-col items-center justify-center p-4 select-none" style="background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0F172A 70%);">

    <!-- Modal de Fin de Juego -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-slate-800 p-8 rounded-2xl border-2 border-neo-accent text-center max-w-sm w-full shadow-[0_0_40px_rgba(16,185,129,0.3)] transform scale-100 transition-transform">
            <h2 class="text-4xl font-bold text-neo-accent mb-4">¡Juego Terminado!</h2>
            <p class="text-xl mb-4 text-slate-300">Las columnas se llenaron.</p>
            <div class="bg-slate-900 rounded-lg p-4 mb-6 border border-slate-700">
                <p class="text-sm text-slate-400 uppercase tracking-wider">Puntuación Final</p>
                <p id="finalScore" class="text-4xl font-black text-white">0</p>
            </div>
            <button onclick="initGame()" class="w-full bg-neo-accent hover:bg-emerald-400 text-slate-900 font-bold py-3 px-6 rounded-lg transition-all hover:scale-105 hover:shadow-[0_0_20px_rgba(16,185,129,0.5)]">
                Jugar de Nuevo
            </button>
        </div>
    </div>

    <!-- UI Principal -->
    <div class="max-w-md w-full">
        <!-- Cabecera -->
        <div class="flex justify-between items-center mb-6 bg-neo-panel p-4 rounded-xl border border-slate-700/50 backdrop-blur-md shadow-lg">
            <div>
                <p class="text-sm text-slate-400 uppercase tracking-wider font-bold">Puntuación</p>
                <p id="scoreDisplay" class="text-3xl font-black text-neo-accent transition-all duration-200">0</p>
            </div>
            <button onclick="initGame()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded shadow transition-colors text-sm font-semibold flex items-center gap-2">
                <span>↻</span> Reiniciar
            </button>
        </div>

        <!-- Mazo / Carta Actual -->
        <div class="mb-8 flex flex-col items-center">
            <p class="text-slate-400 text-sm mb-3 font-semibold uppercase tracking-wider">Siguiente Carta</p>
            <div id="currentCardContainer" class="w-20 h-28 flex items-center justify-center cursor-default transition-transform hover:scale-105">
                <!-- Inyectado por JS -->
            </div>
        </div>

        <!-- Zona de Juego -->
        <div class="grid grid-cols-4 gap-2 sm:gap-4 bg-neo-panel p-2 sm:p-4 rounded-xl border border-slate-700/50 backdrop-blur-md shadow-[0_10px_40px_rgba(0,0,0,0.6)] relative">
            
            <!-- Indicador de bloqueo cuando está animando -->
            <div id="interactionBlocker" class="absolute inset-0 z-50 hidden rounded-xl"></div>

            <!-- Columnas -->
            <div id="col-0" class="col-zone relative w-full h-[380px] sm:h-[420px] bg-black/30 rounded-lg flex flex-col justify-end p-1 cursor-pointer hover:bg-white/5 transition-all border border-transparent hover:border-neo-accent/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.1)]" onclick="handleColumnClick(0)">
                <div class="absolute top-0 left-0 right-0 h-1 bg-red-500/20 rounded-t-lg"></div>
                <!-- Carta vacía como guía de fondo -->
                <div class="absolute bottom-1 left-1 right-1 opacity-40 pointer-events-none">
                    <img src="/cartas/cartaVacia.png" class="w-full h-auto" alt="Vacía">
                </div>
                <div id="col-content-0" class="relative w-full h-full pointer-events-none"></div>
            </div>
            <div id="col-1" class="col-zone relative w-full h-[380px] sm:h-[420px] bg-black/30 rounded-lg flex flex-col justify-end p-1 cursor-pointer hover:bg-white/5 transition-all border border-transparent hover:border-neo-accent/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.1)]" onclick="handleColumnClick(1)">
                <div class="absolute top-0 left-0 right-0 h-1 bg-red-500/20 rounded-t-lg"></div>
                <div class="absolute bottom-1 left-1 right-1 opacity-40 pointer-events-none">
                    <img src="/cartas/cartaVacia.png" class="w-full h-auto" alt="Vacía">
                </div>
                <div id="col-content-1" class="relative w-full h-full pointer-events-none"></div>
            </div>
            <div id="col-2" class="col-zone relative w-full h-[380px] sm:h-[420px] bg-black/30 rounded-lg flex flex-col justify-end p-1 cursor-pointer hover:bg-white/5 transition-all border border-transparent hover:border-neo-accent/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.1)]" onclick="handleColumnClick(2)">
                <div class="absolute top-0 left-0 right-0 h-1 bg-red-500/20 rounded-t-lg"></div>
                <div class="absolute bottom-1 left-1 right-1 opacity-40 pointer-events-none">
                    <img src="/cartas/cartaVacia.png" class="w-full h-auto" alt="Vacía">
                </div>
                <div id="col-content-2" class="relative w-full h-full pointer-events-none"></div>
            </div>
            <div id="col-3" class="col-zone relative w-full h-[380px] sm:h-[420px] bg-black/30 rounded-lg flex flex-col justify-end p-1 cursor-pointer hover:bg-white/5 transition-all border border-transparent hover:border-neo-accent/50 hover:shadow-[0_0_15px_rgba(16,185,129,0.1)]" onclick="handleColumnClick(3)">
                <div class="absolute top-0 left-0 right-0 h-1 bg-red-500/20 rounded-t-lg"></div>
                <div class="absolute bottom-1 left-1 right-1 opacity-40 pointer-events-none">
                    <img src="/cartas/cartaVacia.png" class="w-full h-auto" alt="Vacía">
                </div>
                <div id="col-content-3" class="relative w-full h-full pointer-events-none"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
